version: "3.9"

services:
  # --------------------------------------------------------------------------
  # PostgreSQL Production Relational Database
  # --------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: productguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: productguard_db
      POSTGRES_USER: ${POSTGRES_USER:-productguard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecurePassword2026!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-productguard_user} -d productguard_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # ProductGuard Web Application & AI Computer Vision Engine
  # --------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: productguard_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_CONFIG: production
      FLASK_APP: run.py
      SECRET_KEY: ${SECRET_KEY:-commercial-grade-production-secret-key-32chars}
      DATABASE_URL: postgresql://${POSTGRES_USER:-productguard_user}:${POSTGRES_PASSWORD:-ChangeMeSecurePassword2026!}@db:5432/productguard_db
      UPLOAD_FOLDER: /app/app/static/uploads
      MAX_CONTENT_LENGTH: 5242880
      RATELIMIT_ENABLED: "True"
      RATELIMIT_STORAGE_URI: memory://
      SIMILARITY_THRESHOLD_HIGH: 0.82
      SIMILARITY_THRESHOLD_MODERATE: 0.65
      SIMILARITY_THRESHOLD_MINIMUM: 0.40
      GUNICORN_WORKERS: 2
      GUNICORN_THREADS: 2
      GUNICORN_TIMEOUT: 120
    volumes:
      - uploads_data:/app/app/static/uploads
      - model_cache:/app/.keras
    ports:
      - "5000:5000"

volumes:
  pgdata:
    driver: local
  uploads_data:
    driver: local
  model_cache:
    driver: local
