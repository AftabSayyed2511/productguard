<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
</head>
<body>
    <h2>Shopping Cart</h2>
    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>iPhone 15</td>
                <td>$999</td>
                <td><input type="number" value="1" min="1"></td>
                <td>$999</td>
            </tr>
            <tr>
                <td>Samsung Galaxy S25</td>
                <td>$899</td>
                <td><input type="number" value="1" min="1"></td>
                <td>$899</td>
            </tr>
            <tr>
                <td>OnePlus 12</td>
                <td>$799</td>
                <td><input type="number" value="1" min="1"></td>
                <td>$799</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Total</td>
                <td>$2697</td>
            </tr>
        </tfoot>
    </table>
    <button type="button">Checkout</button>
   <a href="index.html"><button type="button">Continue Shopping</button></a>
</body>
</html>
